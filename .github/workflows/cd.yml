name: CD

on:
  workflow_dispatch:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
  release:
    types:
    - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist:
    name: Build and inspect Python distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # Builds the sdist and wheel, runs twine check, lists their contents in the
    # job summary, and uploads them as the "Packages" artifact
    - uses: hynek/build-and-inspect-python-package@v3.0.2

  publish:
    name: Publish to PyPI
    needs: [dist]
    # Only publish when a GitHub release is published
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    # The pypi environment must be configured in the GitHub repository settings
    # and match the PyPI trusted publisher configuration
    # cf. https://docs.pypi.org/trusted-publishers/
    environment:
      name: pypi
      url: https://pypi.org/project/cabinetry/
    permissions:
      id-token: write  # required for trusted publishing
      attestations: write  # required for actions/attest
      contents: read
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Generate artifact attestation for sdist and wheel
      uses: actions/attest@v4
      with:
        subject-path: dist/*

    - uses: pypa/gh-action-pypi-publish@release/v1
